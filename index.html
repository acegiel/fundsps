<style>
  :root {
    --bg: #f7f4ec;
    --paper: #ffffff;
    --ink: #1a1a1a;
    --ink-soft: #2a2a2a;
    --muted: #6b6b6b;
    --accent: #8b1e1e;
    --border: #d8d4c8;
    --rule: #1a1a1a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'IBM Plex Sans', system-ui, sans-serif;
    font-size: 16px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    max-width: 640px;
    margin: 0 auto;
    padding: 18px 22px 80px;
  }

  /* Language switcher */
  .lang-switch {
    display: flex;
    justify-content: flex-end;
    gap: 0;
    margin-bottom: 14px;
    font-size: 13px;
  }
  .lang-switch button {
    background: none;
    border: none;
    padding: 6px 10px;
    color: var(--muted);
    font-family: inherit;
    font-size: 13px;
    cursor: pointer;
    border-bottom: 1.5px solid transparent;
    transition: color 0.15s, border-color 0.15s;
    letter-spacing: 0.01em;
  }
  .lang-switch button:hover { color: var(--ink); }
  .lang-switch button.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }
  .lang-switch .lang-divider {
    color: var(--border);
    padding: 6px 0;
    user-select: none;
  }

  /* Masthead */
  .mast {
    border-top: 3px solid var(--rule);
    border-bottom: 1px solid var(--border);
    padding: 18px 0 22px;
    margin-bottom: 26px;
  }
  .kicker {
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0 0 10px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .kicker::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--border);
  }
  h1 {
    font-family: 'Newsreader', Georgia, serif;
    font-weight: 500;
    font-size: 34px;
    line-height: 1.1;
    letter-spacing: -0.015em;
    margin: 0 0 12px;
    color: var(--ink);
  }
  .lede {
    font-family: 'Newsreader', Georgia, serif;
    font-style: italic;
    font-size: 17px;
    color: var(--muted);
    margin: 0;
    line-height: 1.5;
  }

  /* Section labels */
  .label {
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 26px 0 10px;
    display: flex;
    align-items: baseline;
    gap: 8px;
    flex-wrap: wrap;
  }
  .label .num {
    font-family: 'Newsreader', serif;
    font-style: italic;
    font-weight: 400;
    color: var(--accent);
    font-size: 13px;
    letter-spacing: 0;
  }
  .label .note {
    color: var(--muted);
    font-weight: 400;
    letter-spacing: 0;
    text-transform: none;
    font-size: 12px;
  }

  /* Inputs */
  .fields {
    display: grid;
    grid-template-columns: 2fr 1fr;
    gap: 8px;
  }
  .fields-stack { grid-template-columns: 1fr 1fr; margin-top: 8px; }
  input, select {
    font-family: inherit;
    font-size: 15px;
    padding: 12px 14px;
    border: 1px solid var(--border);
    background: var(--paper);
    color: var(--ink);
    width: 100%;
    border-radius: 1px;
    transition: border-color 0.15s;
  }
  input::placeholder { color: #b0aca0; }
  input:focus, select:focus {
    outline: none;
    border-color: var(--ink);
  }
  select {
    appearance: none;
    -webkit-appearance: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path fill='%236b6b6b' d='M0 0l5 6 5-6z'/></svg>");
    background-repeat: no-repeat;
    background-position: right 14px center;
    padding-right: 36px;
  }

  /* Email card */
  .email {
    background: var(--paper);
    border: 1px solid var(--border);
    padding: 22px 22px 20px;
    margin-top: 4px;
    position: relative;
  }
  .email::before {
    content: "";
    position: absolute;
    top: -1px;
    left: -1px;
    right: -1px;
    height: 3px;
    background: var(--ink);
  }
  .meta-row {
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 5px;
    display: flex;
    gap: 8px;
  }
  .meta-row .key {
    color: var(--ink);
    font-weight: 500;
    min-width: 64px;
  }
  .meta-row .val { flex: 1; word-break: break-word; }
  .rule { height: 1px; background: var(--border); margin: 14px -22px; }
  .body {
    font-family: 'Newsreader', Georgia, serif;
    font-size: 16.5px;
    line-height: 1.62;
    white-space: pre-wrap;
    color: var(--ink-soft);
  }

  /* Buttons */
  .actions {
    margin-top: 16px;
    display: flex;
    flex-direction: column;
    gap: 9px;
  }
  .btn {
    font-family: inherit;
    font-size: 15px;
    font-weight: 500;
    padding: 15px 18px;
    border-radius: 1px;
    cursor: pointer;
    transition: all 0.15s;
    width: 100%;
    text-align: center;
    text-decoration: none;
    display: block;
    letter-spacing: 0.005em;
  }
  .btn-primary {
    background: var(--ink);
    color: var(--paper);
    border: 1px solid var(--ink);
  }
  .btn-primary:hover, .btn-primary:active {
    background: var(--accent);
    border-color: var(--accent);
  }
  .btn-secondary {
    background: var(--paper);
    color: var(--ink);
    border: 1px solid var(--ink);
  }
  .btn-secondary:hover, .btn-secondary:active {
    background: var(--ink);
    color: var(--paper);
  }
  .btn-ghost {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--border);
    font-size: 13.5px;
    padding: 11px 18px;
  }
  .btn-ghost:hover { color: var(--ink); border-color: var(--ink); }

  /* Footer */
  footer {
    margin-top: 36px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
    font-size: 12px;
    color: var(--muted);
    line-height: 1.55;
  }
  footer .sources-label {
    font-weight: 600;
    color: var(--ink);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-size: 10.5px;
    margin-bottom: 6px;
    display: block;
  }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--ink);
    color: var(--paper);
    padding: 12px 22px;
    font-size: 14px;
    letter-spacing: 0.01em;
    border-radius: 1px;
    transition: transform 0.22s ease;
    pointer-events: none;
    z-index: 50;
    box-shadow: 0 4px 16px rgba(0,0,0,0.18);
  }
  .toast.show { transform: translateX(-50%) translateY(0); }

  @media (max-width: 480px) {
    .wrap { padding: 14px 18px 70px; }
    h1 { font-size: 28px; }
    .lede { font-size: 16px; }
    .fields, .fields-stack { grid-template-columns: 1fr; }
    .email { padding: 18px 18px 16px; }
    .rule { margin: 12px -18px; }
    .body { font-size: 16px; }
  }
</style>
</head>

const SCHOOLS = [
  "Argenziano School",
  "Arthur D. Healey School",
  "Benjamin G. Brown School",
  "Capuano Early Childhood Center",
  "East Somerville Community School",
  "John F. Kennedy School",
  "Next Wave Junior High",
  "West Somerville Neighborhood School",
  "Winter Hill Community School",
  "Somerville High School",
  "Full Circle High School"
];

const RECIPIENT = "s_c@somerville.k12.ma.us";
const RESIDENT_ROLE_INDEX = 6;

let currentLang = 'en';
let state = null;

function L() { return I18N[currentLang]; }

function detectLang() {
  const nav = (navigator.language || 'en').toLowerCase();
  if (nav.startsWith('es')) return 'es';
  if (nav.startsWith('pt')) return 'pt';
  return 'en';
}

function pickN(n, max) {
  const pool = [];
  for (let i = 0; i < max; i++) pool.push(i);
  const out = [];
  for (let i = 0; i < n && pool.length > 0; i++) {
    out.push(pool.splice(Math.floor(Math.random() * pool.length), 1)[0]);
  }
  return out;
}

function roll() {
  const t = L();
  state = {
    sIdx: Math.floor(Math.random() * t.subjects.length),
    oIdx: Math.floor(Math.random() * t.openers.length),
    fIdxs: pickN(2, t.facts.length),
    aIdx: Math.floor(Math.random() * t.asks.length),
    cIdx: Math.floor(Math.random() * t.closers.length)
  };
}

function signatureBlock() {
  const name = document.getElementById('senderName').value.trim();
  const zip = document.getElementById('senderZip').value.trim();
  const roleVal = document.getElementById('senderRole').value;
  const school = document.getElementById('senderSchool').value;
  const t = L();

  const roleIdx = roleVal !== '' ? parseInt(roleVal, 10) : -1;
  const role = roleIdx >= 0 ? t.roles[roleIdx] : '';
  const isResident = roleIdx === RESIDENT_ROLE_INDEX;

  const lines = [];
  if (name) {
    lines.push(name);
    if (role && school && !isResident) lines.push(role + ' — ' + school);
    else if (role) lines.push(role);
  } else {
    if (role && school && !isResident) lines.push(role + ' — ' + school);
    else if (role) lines.push(role);
    else lines.push(t.sigFallback);
  }
  lines.push(zip ? t.sigState + ' ' + zip : t.sigState);
  return '\n\n' + lines.join('\n');
}

function buildBody() {
  const t = L();
  const facts = state.fIdxs.map(function(i) { return t.facts[i]; }).join('\n\n');
  return t.openers[state.oIdx] + '\n\n' + facts + '\n\n' + t.asks[state.aIdx] + '\n\n' + t.closers[state.cIdx] + signatureBlock();
}

function renderEmail() {
  if (!state) return;
  const t = L();
  document.getElementById('subjectPreview').textContent = t.subjects[state.sIdx];
  document.getElementById('bodyPreview').textContent = buildBody();
  const link = document.getElementById('sendBtn');
  link.href = 'mailto:' + RECIPIENT + '?subject=' + encodeURIComponent(t.subjects[state.sIdx]) + '&body=' + encodeURIComponent(buildBody());
}

function applyLanguage(lang) {
  currentLang = lang;
  document.documentElement.lang = lang;
  const t = L();

  document.getElementById('kicker').textContent = t.kicker;
  document.getElementById('h1').textContent = t.h1;
  document.getElementById('lede').textContent = t.lede;
  document.getElementById('label1').textContent = t.label1;
  document.getElementById('label1Note').textContent = t.label1Note;
  document.getElementById('label2').textContent = t.label2;
  document.getElementById('label2Note').textContent = t.label2Note;
  document.getElementById('label3').textContent = t.label3;
  document.getElementById('senderName').placeholder = t.namePh;
  document.getElementById('senderZip').placeholder = t.zipPh;
  document.getElementById('metaToKey').textContent = t.metaTo;
  document.getElementById('metaSubjectKey').textContent = t.metaSubject;
  document.getElementById('sendBtn').textContent = t.btnSend;
  document.getElementById('copyBtn').textContent = t.btnCopy;
  document.getElementById('regenBtn').textContent = t.btnRegen;
  document.getElementById('sourcesLabel').textContent = t.sourcesLabel;
  document.getElementById('sourcesText').textContent = t.sourcesText;

  const roleSelect = document.getElementById('senderRole');
  const prevRole = roleSelect.value;
  roleSelect.innerHTML = '';
  const ph = document.createElement('option');
  ph.value = '';
  ph.textContent = t.rolePh;
  roleSelect.appendChild(ph);
  t.roles.forEach(function(r, i) {
    const opt = document.createElement('option');
    opt.value = String(i);
    opt.textContent = r;
    roleSelect.appendChild(opt);
  });
  roleSelect.value = prevRole;

  const schoolSelect = document.getElementById('senderSchool');
  const prevSchool = schoolSelect.value;
  if (schoolSelect.options.length === 0) {
    const sp = document.createElement('option');
    sp.value = '';
    sp.textContent = t.schoolPh;
    schoolSelect.appendChild(sp);
    SCHOOLS.forEach(function(s) {
      const opt = document.createElement('option');
      opt.value = s;
      opt.textContent = s;
      schoolSelect.appendChild(opt);
    });
  } else {
    schoolSelect.options[0].textContent = t.schoolPh;
  }
  schoolSelect.value = prevSchool;

  document.querySelectorAll('#langSwitch button').forEach(function(b) {
    b.classList.toggle('active', b.dataset.lang === lang);
  });

  document.title = t.h1.replace(/\.$/, '');
  renderEmail();
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(function() { t.classList.remove('show'); }, 2200);
}

document.getElementById('regenBtn').addEventListener('click', function() {
  roll();
  renderEmail();
});

['senderName', 'senderZip', 'senderRole', 'senderSchool'].forEach(function(id) {
  const el = document.getElementById(id);
  el.addEventListener(el.tagName === 'SELECT' ? 'change' : 'input', renderEmail);
});

document.getElementById('copyBtn').addEventListener('click', async function() {
  const t = L();
  const text = t.metaTo + ': ' + RECIPIENT + '\n' + t.metaSubject + ': ' + t.subjects[state.sIdx] + '\n\n' + buildBody();
  try {
    await navigator.clipboard.writeText(text);
    showToast(t.toastCopied);
  } catch (err) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try {
      document.execCommand('copy');
      showToast(t.toastCopied);
    } catch (e) {
      showToast(t.toastCopyFail);
    }
    document.body.removeChild(ta);
  }
});

document.querySelectorAll('#langSwitch button').forEach(function(btn) {
  btn.addEventListener('click', function() {
    applyLanguage(btn.dataset.lang);
  });
});

roll();
applyLanguage(detectLang());
</script>
